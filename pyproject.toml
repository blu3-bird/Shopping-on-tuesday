[project]
name = "shopping-on-tuesday"
version = "0.1.0"
description = "A Flask-based Meesho dropshipping/reselling e-commerce store"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Shopping on Tuesday Contributors", email = "contributors@shoppingontuesday.dev" },
]
license = { text = "MIT" }
dependencies = [
    "alembic>=1.18.5,<2.0.0",
    "blinker>=1.9.0,<2.0.0",
    "beautifulsoup4>=4.13.0,<5.0.0",
    "click>=8.4.2,<9.0.0",
    "colorama>=0.4.6,<0.5.0",
    "dnspython>=2.8.0,<3.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "Flask>=3.1.3,<4.0.0",
    "Flask-Login>=0.6.3,<0.7.0",
    "Flask-Migrate>=4.1.0,<5.0.0",
    "Flask-SQLAlchemy>=3.1.1,<4.0.0",
    "Flask-WTF>=1.3.0,<2.0.0",
    "greenlet>=3.5.3,<4.0.0",
    "gunicorn>=26.0.0,<27.0.0",
    "idna>=3.18,<4.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "Jinja2>=3.1.6,<4.0.0",
    "Mako>=1.3.12,<2.0.0",
    "MarkupSafe>=3.0.3,<4.0.0",
    "packaging>=26.2,<27.0.0",
    "pillow>=13.0.0,<14.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "SQLAlchemy>=2.0.51,<3.0.0",
    "typing-extensions>=4.15.0,<5.0.0",
    "Werkzeug>=3.1.8,<4.0.0",
    "WTForms>=3.2.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-flask>=1.3.0,<2.0.0",
    "black>=24.4.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "isort>=5.13.0,<6.0.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-flask = ">=1.3.0,<2.0.0"
black = ">=24.4.0,<25.0.0"
flake8 = ">=7.1.0,<8.0.0"
isort = ">=5.13.0,<6.0.0"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.poetry.scripts]
shopping-on-tuesday = "app:main"
